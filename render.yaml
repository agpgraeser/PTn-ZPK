# Render-Deploy-Konfiguration – PTn-ZPK (FastAPI)
# Ein Web Service (Python). Nach dem Verbinden deployt Render automatisch bei 'git push'.
# Render setzt $PORT selbst; uvicorn muss auf 0.0.0.0:$PORT binden.

services:
  - type: web
    name: ptn-zpk
    runtime: python
    plan: free
    # Ohne diese Zeile legt Render den Dienst in Oregon an (Standard);
    # von Essen aus ist Frankfurt rund viermal schneller.
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
